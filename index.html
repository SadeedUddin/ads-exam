<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Meta & Google Ads Exam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* layout: one narrow exam sheet, one question on screen at a time, timer rail on top */
:root{--bg:#f3f5f8;--sheet:#fff;--fg:#17202e;--muted:#5b6778;--line:#d5dbe4;--accent:#1f4fd8;--on-accent:#fff;--warn:#b45309;--bad:#b3261e;--good:#18794e;
--sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--sheet:#182030;--fg:#e6ebf3;--muted:#9aa6b8;--line:#2c384c;--accent:#7ea2ff;--on-accent:#0f141c;--warn:#f0a94a;--bad:#ff8a80;--good:#5fd39a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--sheet:#182030;--fg:#e6ebf3;--muted:#9aa6b8;--line:#2c384c;--accent:#7ea2ff;--on-accent:#0f141c;--warn:#f0a94a;--bad:#ff8a80;--good:#5fd39a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);padding:24px 16px;user-select:none;-webkit-user-select:none}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.15rem;line-height:1.4;margin:0;font-weight:500}
p,ul{margin:0}ul{padding-inline-start:1.2em;display:flex;flex-direction:column;gap:6px}
.label{font:500 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.clock{font:500 1.25rem var(--mono);font-variant-numeric:tabular-nums}
.rail{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent)}
.low .clock{color:var(--bad)}.low .rail i{background:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
button,input{font:inherit;color:inherit}
.opt{text-align:start;background:transparent;border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:500}
.go{align-self:flex-start;background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:11px 20px;font-weight:600;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
#warn{border:1px solid var(--warn);color:var(--warn);border-radius:4px;padding:10px 14px;font-weight:500}
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 16px}
dt{color:var(--muted)}dd{margin:0;font:500 1rem var(--mono);font-variant-numeric:tabular-nums;text-align:end}
.big{font:500 2.5rem/1 var(--mono)}.pass{color:var(--good)}.fail{color:var(--bad)}
[dir="rtl"] .label{font:500 .85rem var(--sans);letter-spacing:0}
[dir="rtl"] body{line-height:1.8}
.langs{display:flex;gap:8px}.langs .opt{padding:8px 18px}
#review{margin:0;padding-inline-start:1.5em;display:flex;flex-direction:column;gap:16px}
#review li>div{display:flex;flex-direction:column;gap:4px}
#review .a{font-size:.95rem}
.opt:disabled{opacity:.5;cursor:not-allowed}
.rvrow{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main class="wrap">
  <div id="warn" role="alert" hidden></div>
  <section class="sheet" id="intro">
    <span class="label">Language / اللغة</span>
    <div class="langs"><button class="opt" id="l-en" lang="en">English</button><button class="opt" id="l-ar" lang="ar">العربية</button></div>
    <span class="label" data-t="kicker"></span>
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
    <ul id="rules"></ul>
    <label class="label" for="cand" data-t="name"></label>
    <input id="cand" autocomplete="off" maxlength="60">
    <button class="go" id="start" disabled data-t="start"></button>
  </section>

  <section class="sheet" id="quiz" hidden>
    <div class="row"><span class="label" id="pos"></span><span class="clock" id="clock"></span></div>
    <div class="rail"><i id="bar"></i></div>
    <span class="label" id="tag"></span>
    <h2 id="q"></h2>
    <div class="opts" id="opts"></div>
    <button class="go" id="next"></button>
  </section>

  <section class="sheet" id="rev" hidden>
    <span class="label" data-t="revKicker"></span>
    <h1 data-t="revTitle"></h1>
    <p id="revLead"></p>
    <div class="opts" id="revList"></div>
    <button class="go" id="submit"></button>
  </section>

  <section class="sheet" id="done" hidden>
    <span class="label" data-t="result"></span>
    <h1 id="who"></h1>
    <div class="row"><span class="big" id="pct"></span><span class="label" id="verdict"></span></div>
    <p id="why" class="fail" hidden></p>
    <dl id="stats"></dl>
    <p class="muted" id="mail" role="status"></p>
    <h2 data-t="review"></h2>
    <ol id="review"></ol>
  </section>
</main>

rules:["Each question has {t} in total. Time you have used stays used if you leave a question and come back.","You can skip a question, then answer or change it from the review screen while it still has time left.","Leaving this tab, switching window or exiting full screen counts as a warning. The third warning ends the test.","Copy, paste and right-click are off. Click only inside the test.","Reloading starts a new attempt, and the attempt number shows on your result."],
name:"Full name",ph:"As it should appear on the result",start:"Start test",pos:(a,b)=>`Question ${a} of ${b}`,tag:{Meta:"Meta Ads",Google:"Google Ads"},next:"Next question",skip:"Skip for now",back:"Back to review",revKicker:"Review",revTitle:"Check your answers before you submit",revLead:(a,n)=>`Answered ${a} of ${n}. Open any question that still has time left to answer it or change your answer.`,done:"Answered",todo:"Not answered",left:"left",noTime:"Time used up",submit:"Submit test",confirm:"Confirm: submit now",
warn:n=>`Warning ${n} of ${MAX}: you left the test window. The test ends at ${MAX}.`,ended:"Test ended: you left the test window three times.",result:"Result",
verdict:{void:"Void",strong:"Strong pass",pass:"Pass",fail:"Not passed"},sending:"Sending your result to the examiner…",sent:"Your result was sent to the examiner.",notSent:"The result could not be sent. Show this screen to your examiner.",review:"Answer review",yours:"Your answer",right:"Correct answer",none:"No answer",
stats:["Total","Meta Ads","Google Ads","Answered","Focus warnings","Attempt on this device","Time taken","Finished"],unknown:"unknown",dur:(m,s)=>`${m}m ${s}s`,loc:"en-GB"},
ar:{kicker:"الإعلانات المدفوعة · اختبار مُراقَب",title:"اختبار إعلانات Meta وإعلانات Google",lead:"30 سؤالًا تطبيقيًا، 15 لكل منصة، تُختار عشوائيًا من بنك أسئلة أكبر. درجة النجاح 70%.",
rules:["لكل سؤال {t} إجمالًا، ويبقى الوقت المستهلك محسوبًا إذا غادرت السؤال ثم عدت إليه.","يمكنك تخطي أي سؤال ثم الإجابة عنه أو تعديل إجابته من شاشة المراجعة ما دام له وقت متبقٍّ.","مغادرة هذه الصفحة أو الانتقال إلى نافذة أخرى أو الخروج من وضع ملء الشاشة يُحتسب إنذارًا، والإنذار الثالث يُنهي الاختبار.","النسخ واللصق والنقر بالزر الأيمن معطّلة. يُرجى النقر داخل الاختبار فقط.","إعادة تحميل الصفحة تبدأ محاولة جديدة، ويظهر رقم المحاولة في النتيجة."],
name:"الاسم الكامل",ph:"كما ينبغي أن يظهر في النتيجة",start:"بدء الاختبار",pos:(a,b)=>`السؤال ${a} من ${b}`,tag:{Meta:"إعلانات Meta",Google:"إعلانات Google"},next:"السؤال التالي",skip:"تخطٍّ مؤقت",back:"العودة إلى المراجعة",revKicker:"المراجعة",revTitle:"راجع إجاباتك قبل التسليم",revLead:(a,n)=>`أُجيب عن ${a} من ${n}. يمكنك فتح أي سؤال ما زال له وقت متبقٍّ للإجابة عنه أو تعديل إجابته.`,done:"تمت الإجابة",todo:"لم تتم الإجابة",left:"متبقٍّ",noTime:"انتهى الوقت",submit:"تسليم الاختبار",confirm:"تأكيد: التسليم الآن",
warn:n=>`إنذار ${n} من ${MAX}: غادرتَ نافذة الاختبار. ينتهي الاختبار عند الإنذار ${MAX}.`,ended:"انتهى الاختبار: غادرتَ نافذة الاختبار ثلاث مرات.",result:"النتيجة",
verdict:{void:"ملغاة",strong:"نجاح بتفوّق",pass:"ناجح",fail:"لم ينجح"},sending:"جارٍ إرسال نتيجتك إلى المُمتحِن…",sent:"أُرسلت نتيجتك إلى المُمتحِن.",notSent:"تعذّر إرسال النتيجة. يُرجى عرض هذه الشاشة على المُمتحِن.",review:"مراجعة الإجابات",yours:"إجابتك",right:"الإجابة الصحيحة",none:"لم تُجب عن هذا السؤال",
stats:["المجموع","إعلانات Meta","إعلانات Google","الأسئلة المُجاب عنها","إنذارات مغادرة النافذة","رقم المحاولة على هذا الجهاز","الوقت المستغرق","وقت الانتهاء"],unknown:"غير معروف",dur:(m,s)=>`${m} د ${s} ث`,loc:"ar-AE-u-nu-latn"}};
for(const l of["en","ar"])Object.assign(T[l],CFG[l]); // per-test title, intro line and time wording
let lang,L;
function setLang(l){lang=l;L=T[l];const r=document.documentElement;r.lang=l;r.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=L[e.dataset.t]);$('cand').placeholder=L.ph;
  $('rules').replaceChildren(...L.rules.map(x=>Object.assign(document.createElement('li'),{textContent:x.replace('{t}',L.time)})));
  for(const k of['en','ar'])$('l-'+k).setAttribute('aria-pressed',k===l)}
$('l-en').onclick=()=>setLang('en');$('l-ar').onclick=()=>setLang('ar');setLang('en');
let qs,cur=null,first=true,armed=false,deadline,tick,strikes=0,lastStrike=0,running=false,t0,attempt=null;
const el=(tag,cls,text)=>Object.assign(document.createElement(tag),{className:cls,textContent:text});
const fmt=ms=>{const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};

$('cand').oninput=e=>$('start').disabled=e.target.value.trim().length<3;
$('start').onclick=()=>{
  try{attempt=(+localStorage.getItem('adsExamAttempts'+CFG.id)||0)+1;localStorage.setItem('adsExamAttempts'+CFG.id,attempt)}catch(e){}
  const draw=p=>shuffle(BANK.filter(q=>q[0]===p)).slice(0,PER);
  qs=shuffle([...draw('Meta'),...draw('Google')]).map(r=>{const[q,...o]=r[lang==='ar'?2:1];return{t:r[0],q,left:SECS*1000,o:shuffle(o.map((x,k)=>({x,ok:k===0})))}});
  document.documentElement.requestFullscreen?.().catch(()=>{});
  $('intro').hidden=true;running=true;t0=Date.now();open(0);tick=setInterval(clock,250);
};
function open(k){ // each question keeps one 60s budget across every visit, so skipping never buys extra time
  const c=qs[cur=k];deadline=Date.now()+c.left;$('rev').hidden=true;$('quiz').hidden=false;
  $('pos').textContent=L.pos(k+1,qs.length);$('tag').textContent=L.tag[c.t];$('q').textContent=c.q;
  $('opts').replaceChildren(...c.o.map((o,n)=>{const b=el('button','opt',o.x);b.setAttribute('aria-pressed',n===c.p);
    b.onclick=()=>{c.p=n;[...$('opts').children].forEach((x,m)=>x.setAttribute('aria-pressed',m===n));label()};return b}));
  label();clock();
}
function label(){$('next').textContent=!first?L.back:qs[cur].p===undefined?L.skip:L.next}
function clock(){ // deadline-based so a throttled background tab cannot stretch the time
  if(cur===null)return;
  const left=Math.max(0,deadline-Date.now());
  $('clock').textContent=fmt(left);$('bar').style.width=left/SECS/10+'%';$('quiz').classList.toggle('low',left<=10000);
  if(!left)leave();
}
function leave(){
  if(!running||cur===null)return;
  const k=cur;qs[k].left=Math.max(0,deadline-Date.now());cur=null;
  first&&k<qs.length-1?open(k+1):review();
}
$('next').onclick=leave;
function review(){ // rows show no question text, so the untimed review screen gives nothing to look up
  first=armed=false;$('quiz').hidden=true;$('rev').hidden=false;$('submit').textContent=L.submit;
  $('revLead').textContent=L.revLead(qs.filter(c=>c.p!==undefined).length,qs.length);
  $('revList').replaceChildren(...qs.map((c,k)=>{const b=el('button','opt rvrow','');b.disabled=!c.left;b.onclick=()=>open(k);
    b.append(el('span','',`${L.pos(k+1,qs.length)} · ${L.tag[c.t]}`),el('span','',`${c.p===undefined?L.todo:L.done} · ${c.left?fmt(c.left)+' '+L.left:L.noTime}`));return b}));
}
$('submit').onclick=()=>{if(armed)return finish();armed=true;$('submit').textContent=L.confirm};
function strike(){
  if(!running||Date.now()-lastStrike<1500)return; // blur + visibilitychange fire together
  lastStrike=Date.now();strikes++;
  if(strikes>=MAX)return finish(L.ended);
  $('warn').hidden=false;$('warn').textContent=L.warn(strikes);
}
document.addEventListener('visibilitychange',()=>document.hidden&&strike());
addEventListener('blur',strike);
document.addEventListener('fullscreenchange',()=>document.fullscreenElement||strike());
['copy','cut','paste','contextmenu','dragstart'].forEach(e=>document.addEventListener(e,v=>v.target.id!=='cand'&&v.preventDefault()));
document.addEventListener('keydown',e=>(e.ctrlKey||e.metaKey)&&'capsu'.includes(e.key.toLowerCase())&&e.target.id!=='cand'&&e.preventDefault());
function finish(why){
  running=false;cur=null;clearInterval(tick);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  const score={Meta:0,Google:0};let answered=0;qs.forEach(c=>{if(c.p!==undefined){answered++;if(c.o[c.p].ok)score[c.t]++}});
  const total=score.Meta+score.Google,pct=Math.round(total/qs.length*100),ok=pct>=PASS&&!why,secs=Math.round((Date.now()-t0)/1000);
  $('quiz').hidden=$('rev').hidden=$('warn').hidden=true;$('done').hidden=false;$('who').textContent=$('cand').value.trim();
  $('pct').textContent=pct+'%';$('pct').className='big '+(ok?'pass':'fail');
  $('verdict').textContent=L.verdict[why?'void':pct>=85?'strong':ok?'pass':'fail'];
  if(why){$('why').hidden=false;$('why').textContent=why}
  const vals=[`${total} / ${qs.length}`,`${score.Meta} / ${PER}`,`${score.Google} / ${PER}`,`${answered} / ${qs.length}`,`${strikes} / ${MAX}`,attempt??L.unknown,L.dur(Math.floor(secs/60),secs%60),new Date().toLocaleString(L.loc)];
  $('stats').replaceChildren(...L.stats.flatMap((k,n)=>[el('dt','',k),el('dd','',vals[n])]));
  const verdict=$('verdict').textContent,mail={_subject:`${CFG.en.title}: ${$('who').textContent} ${pct}% (${verdict})`,_template:'table',_captcha:'false',Candidate:$('who').textContent,Test:L.title,Result:`${pct}% (${verdict})`};
  if(why)mail.Note=why;
  L.stats.forEach((k,n)=>mail[k]=String(vals[n]));
  $('review').replaceChildren(...qs.map((c,k)=>{const mine=c.o[c.p],good=mine?.ok,right=c.o.find(o=>o.ok).x,li=document.createElement('li'),d=document.createElement('div');
    mail[`Q${k+1} ${good?'✓':'✗'}`]=`${c.q} | ${L.yours}: ${mine?mine.x:L.none} | ${L.right}: ${right}`;
    d.append(el('span','',c.q),el('span','a '+(good?'pass':'fail'),`${good?'✓':'✗'} ${L.yours}: ${mine?mine.x:L.none}`),el('span','a',`${L.right}: ${right}`));li.append(d);return li}));
  // shortcut: sent from the browser through formsubmit.co, so a candidate can block or fake it; use a server endpoint if results must be tamper-proof
  $('mail').textContent=L.sending;
  fetch('https://formsubmit.co/ajax/'+CFG.email,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(mail)})
    .then(r=>r.json()).then(j=>{if(String(j.success)!=='true')throw 0;$('mail').textContent=L.sent})
    .catch(()=>{$('mail').textContent=L.notSent;$('mail').className='fail'});
}
</script>
